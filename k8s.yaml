# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: student
---
# Database
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: student
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
      - name: db
        image: mcr.microsoft.com/mssql/server:2022-latest
        ports:
        - containerPort: 1433
        env:
        - name: ACCEPT_EULA
          value: "Y"
        - name: SA_PASSWORD
          value: "123456"
        - name: MSSQL_PID
          value: "Express"
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: student
spec:
  selector:
    app: db
  ports:
  - port: 1433
---
# Backend
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: student
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: student-backend:v1.0.0
        imagePullPolicy: Never
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          value: "production"
        - name: DB_SERVER
          value: "db"
        - name: DB_DATABASE
          value: "student_management"
        - name: DB_USER
          value: "sa"
        - name: DB_PASSWORD
          value: "123456"
        - name: JWT_SECRET
          value: "e27cb750e70afacacf5cbb22d313a8284ec057a392e441d39bab6626936b23d12769698a04802d53ad4f56eda332d339a86d7a8e290ad9f16f68e6e6730c6b18"
        - name: JWT_REFRESH_SECRET
          value: "5a2254743b41c81d400b814af4ce3249e838b2d70d95a876695d6dc2650020e560211c07fe7eb70cc8d887bd059df23f57eff4d1fb44e03687ec62b6d91e7c9f"
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: student
spec:
  selector:
    app: backend
  ports:
  - port: 3000
---
# Frontend
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: student
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: student-frontend:v1.0.0
        imagePullPolicy: Never
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: student
spec:
  type: LoadBalancer
  selector:
    app: frontend
  ports:
  - port: 80